[package]
name = "konnect"
version = "0.1.0"
edition = "2024"
description = "Named local routes for Kubernetes port forwards"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
schemars = "1.2.1"
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }

[build-dependencies]
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
system_status_bar_macos = { path = "crates/system_status_bar_macos" }
